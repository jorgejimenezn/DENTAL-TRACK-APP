<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio · DENTAL TRACK</title>
<link rel="stylesheet" href="css/estilos.css">
<style>
  .bienvenida{max-width:720px}
  .bienvenida h1{font-size:26px}
  .tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:22px}
  .tarjeta{display:block;text-decoration:none;color:var(--texto);background:var(--panel);border:1px solid var(--panel-borde);border-radius:var(--radio);padding:18px;transition:.15s}
  a.tarjeta:hover{border-color:var(--borde-hover);background:var(--hover)}
  .tarjeta b{display:block;font-size:15px;margin-bottom:4px}
  .tarjeta span{color:var(--texto-2);font-size:13px}
  .tarjeta.pronto{opacity:.6}
</style>
</head>
<body>
<div class="marca" id="marca" aria-hidden="true"></div>
<div class="app">
  <aside class="lateral" id="lateral"></aside>
  <main class="contenido">
    <div class="bienvenida">
      <h1 id="saludo">Bienvenido</h1>
      <p style="color:var(--texto-2)" id="rolTexto"></p>
      <div class="tarjetas" id="tarjetas"></div>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
  const usuario = iniciarPagina();
  if (usuario) {
    $("saludo").textContent = `Hola, ${usuario.nombre}`;
    $("rolTexto").textContent = `Sesión iniciada como ${NOMBRES_ROL[usuario.rol] || usuario.rol}.`;
    const tarjeta = (href, titulo, texto) => href
      ? `<a class="tarjeta" href="${href}"><b>${titulo}</b><span>${texto}</span></a>`
      : `<div class="tarjeta pronto"><b>${titulo}</b><span>${texto}</span></div>`;
    let html = "";
    if (usuario.rol === "admin") {
      html = tarjeta("clientes.html", "Clientes", "Doctores, clínicas, direcciones y prioridad.")
           + tarjeta("empleados.html", "Empleados", "Usuarios del laboratorio, roles y áreas.")
           + tarjeta("bitacora.html", "Bitácora", "Accesos y cambios registrados en MongoDB.")
           + tarjeta("catalogos.html", "Catálogos", "Tipos de trabajo, materiales, unidades, guías, colores, motivos y áreas.")
           + tarjeta("flujos.html", "Flujos de trabajo", "Pasos por tipo de trabajo y modalidad, con cobertura de técnicos.")
           + tarjeta("asignaciones.html", "Asignaciones", "Tipos de trabajo que atiende cada empleado por área.")
           + tarjeta("calendario.html", "Calendario y reglas", "Horas de corte, días mínimos y días no laborables.")
           + tarjeta("areas.html", "Áreas y metas", "Trabajo por lote, simultáneos y meta de horas por área.")
           + tarjeta("dashboard.html", "Dashboard", "Operación en vivo y desempeño del laboratorio.")
           + tarjeta("cobros.html", "Cobros", "Facturas pendientes de pago por antigüedad.")
           + tarjeta("bandeja.html", "Bandeja del laboratorio", "Carga de cada área, colas y casos sin técnico.")
           + tarjeta("casos.html", "Solicitudes", "Casos nuevos (CN) y reaperturas (RP) de todos los clientes.")
           + tarjeta("nueva-solicitud.html", "Nueva solicitud", "Capturar un caso a nombre de un cliente.");
    } else if (usuario.rol === "doctor") {
      html = tarjeta("nueva-solicitud.html", "Nueva solicitud", "Ingresa un caso nuevo (CN), digital o analógico.")
           + tarjeta("casos.html", "Mis casos", "Casos vigentes e historial. Desde un caso entregado puedes pedir una reapertura (RP).")
           + tarjeta("tablero.html", "Mi tablero", "Tus casos vigentes en Kanban, por etapa.");
    } else if (usuario.rol === "operaciones") {
      html = tarjeta("dashboard.html", "Dashboard de operación", "Carga en vivo, cumplimiento de metas, puntualidad, retrabajos, reaperturas y mapas de entregas y recolectas.")
           + tarjeta("agenda.html", "Agenda de entregas", "Atrasados, lo que sale hoy y los próximos días.")
           + tarjeta("pausas.html", "Pausas", "Casos detenidos y su historial.")
           + tarjeta("cobros.html", "Cobros", "Facturas pendientes de pago por antigüedad.")
           + tarjeta("casos.html", "Solicitudes", "Consulta de casos nuevos y reaperturas.");
    } else if (usuario.rol === "supervisor") {
      html = tarjeta("dashboard.html", "Dashboard", "Operación en vivo y cumplimiento de metas.")
           + tarjeta("bandeja.html", "Bandeja del laboratorio", "Carga de cada área, colas y casos sin técnico.")
           + tarjeta("agenda.html", "Agenda de entregas", "Atrasados, lo que sale hoy, el siguiente día hábil y lo que está listo.")
           + tarjeta("validaciones.html", "Validación de diseño", "Diseños por enviar al cliente y los que esperan su respuesta.")
           + tarjeta("pausas.html", "Pausas", "Casos detenidos por falta de algo y su historial.")
           + tarjeta("ausencias.html", "Ausencias", "Quién no labora: el sistema no le asigna y reparte lo suyo.")
           + tarjeta("casos.html", "Solicitudes", "Casos nuevos y reaperturas de todos los clientes.")
           + tarjeta("nueva-solicitud.html", "Nueva solicitud", "Capturar un caso a nombre de un cliente.")
           + tarjeta("clientes.html", "Clientes", "Direcciones, cliente Odoo y crédito.");
    } else if (usuario.rol === "demo") {
      html = tarjeta("bandeja.html", "Línea de producción", "Haz cualquier paso: recolecta, Ingresos, producción, QA, facturación y entrega.")
           + tarjeta("nueva-solicitud.html", "Nueva solicitud", "Capturar un caso a nombre de un cliente para la demostración.")
           + tarjeta("tablero.html", "Tablero por cliente", "La vista Kanban que ve el doctor.")
           + tarjeta("dashboard.html", "Dashboard", "Operación en vivo y desempeño (consulta).")
           + tarjeta("casos.html", "Solicitudes", "Todos los casos con su recorrido.")
           + tarjeta("clientes.html", "Clientes", "Consulta de clientes y datos comerciales.")
           + tarjeta("empleados.html", "Empleados", "Consulta de usuarios, roles y áreas.")
           + tarjeta("flujos.html", "Flujos de trabajo", "Consulta de los pasos por tipo de trabajo.")
           + tarjeta("cobros.html", "Cobros", "Consulta de facturas pendientes.");
    } else if (usuario.rol === "mensajero") {
      html = tarjeta("bandeja.html", "Mis rutas", "Recolectas y entregas que te asignó Logística.")
           + tarjeta("casos.html", "Solicitudes", "Consulta de casos.");
    } else {
      html = tarjeta("bandeja.html", "Mi bandeja", usuario.rol === "tecnico" ? "Tu trabajo actual y el siguiente que te entrega el sistema por prioridad." : "Casos que esperan a tu área.")
           + tarjeta("mis-metricas.html", "Mis métricas", "Tu avance: terminados, tiempos frente a la meta y próximos vencimientos.")
           + (usuario.rol === "facturacion" ? tarjeta("cobros.html", "Cobros", "Facturas pendientes de pago por antigüedad.") : "")
           + tarjeta("casos.html", "Solicitudes", "Consulta de casos nuevos y reaperturas.")
           + (["ingresos", "facturacion"].includes(usuario.rol) ? tarjeta("nueva-solicitud.html", "Nueva solicitud", "Orden manual a nombre de un cliente.") : "");
    }
    $("tarjetas").innerHTML = html;
  }
</script>
</body>
</html>
