<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pausas · DENTAL TRACK</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="marca" id="marca" aria-hidden="true"></div>
<div class="app">
  <aside class="lateral" id="lateral"></aside>
  <main class="contenido">
    <div class="encabezado">
      <div>
        <h1>Pausas</h1>
        <p>Auditoría de los casos que supervisión detuvo: quién, por qué, dónde estaba el caso y cuánto duró.</p>
      </div>
      <button class="btn" id="btnActualizar">Actualizar</button>
    </div>
    <div class="card">
      <div class="filtros">
        <div class="campo"><label>Desde</label><input type="date" id="fDesde"></div>
        <div class="campo"><label>Hasta</label><input type="date" id="fHasta"></div>
        <div class="campo"><label>Estado</label><select id="fEstado"><option value="">Todas</option><option value="abiertas">En pausa ahora</option><option value="cerradas">Reanudadas</option></select></div>
        <div class="campo ancho"><label>Buscar</label><input id="fTexto" placeholder="Código, cliente o motivo"></div>
      </div>
      <div class="kpis" id="resumen" style="margin-bottom:14px"></div>
      <div class="tabla-wrap">
        <table class="responsiva">
          <thead><tr><th>Caso</th><th>Motivo</th><th>Pausó</th><th>Reanudó</th><th>Horas laborales</th></tr></thead>
          <tbody id="tabla"><tr><td colspan="5" class="cargando">Cargando…</td></tr></tbody>
        </table>
      </div>
      <p class="nota">Las horas en pausa no cuentan para las metas de las áreas ni para el plazo de recolecta.</p>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
if (!iniciarPagina(["admin", "supervisor", "operaciones", "demo"])) throw new Error("sin acceso");
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hoy = new Date(), hace = new Date(); hace.setDate(hoy.getDate() - 29);
$("fDesde").value = ymd(hace); $("fHasta").value = ymd(hoy);
let pausas = [];
const kpi = (t, v, s = "") => `<div class="kpi"><span>${t}</span><b>${v}</b>${s ? `<small>${s}</small>` : ""}</div>`;

function pintar() {
  const texto = $("fTexto").value.trim().toLowerCase(), estado = $("fEstado").value;
  const lista = pausas.filter(p => (!texto || [p.codigo, p.cliente, p.motivo].some(v => (v || "").toLowerCase().includes(texto)))
    && (!estado || (estado === "abiertas" ? !p.reanudado_en : !!p.reanudado_en)));
  const cerradas = pausas.filter(p => p.reanudado_en), horas = cerradas.reduce((t, p) => t + (p.horas_laborales || 0), 0);
  $("resumen").innerHTML = kpi("Pausas en el periodo", pausas.length) + kpi("En pausa ahora", pausas.length - cerradas.length)
    + kpi("Promedio en pausa", cerradas.length ? `${(horas / cerradas.length).toFixed(1)} h` : "—", "horas laborales");
  $("tabla").innerHTML = lista.length ? lista.map(p => `<tr>
      <td class="principal"><a class="codigo-caso" href="caso.html?id=${p.solicitud_id}">${escapar(p.codigo)}</a><span class="sub">${escapar(p.cliente || "")}${p.areas ? ` · ${escapar(p.areas)}` : ""}</span></td>
      <td data-label="Motivo">${escapar(p.motivo)}${p.nota_reanudar ? `<span class="sub">Al reanudar: ${escapar(p.nota_reanudar)}</span>` : ""}</td>
      <td data-label="Pausó">${escapar(p.pausado_por || "—")}<span class="sub">${escapar(fechaHora(p.pausado_en))}</span></td>
      <td data-label="Reanudó">${p.reanudado_en ? `${escapar(p.reanudado_por || "—")}<span class="sub">${escapar(fechaHora(p.reanudado_en))}</span>` : '<span class="badge naranja">En pausa</span>'}
        ${p.fecha_entrega_nueva ? `<span class="sub">Entrega movida a ${escapar(p.fecha_entrega_nueva)}</span>` : ""}</td>
      <td data-label="Horas">${p.horas_laborales != null ? `${p.horas_laborales} h` : "—"}</td></tr>`).join("")
    : '<tr><td colspan="5" class="vacio">No hay pausas en este periodo.</td></tr>';
}
async function cargar() {
  try { pausas = await api("GET", `/pausas?desde=${$("fDesde").value}&hasta=${$("fHasta").value}`); pintar(); }
  catch (error) { $("tabla").innerHTML = `<tr><td colspan="5" class="vacio">${escapar(error.message)}</td></tr>`; }
}
["fDesde", "fHasta"].forEach(id => $(id).onchange = cargar);
$("fEstado").onchange = pintar;
$("fTexto").addEventListener("input", debounce(pintar, 250));
$("btnActualizar").onclick = cargar;
cargar();
</script>
</body>
</html>
